[package]
name = "deepseek-harness-rs"
version = "1.1.1"
edition = "2021"
default-run = "harness"
authors = ["Harness Team"]
description = "Ultra-resource-efficient web-based agentic harness written in Rust"

[[bin]]
name = "harness"
path = "src/main.rs"

[[bin]]
name = "harness-client"
path = "src/bin/harness_client.rs"

[[bin]]
name = "harness-server"
path = "src/bin/harness_server.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process", "signal"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-trait = "0.1"
sysinfo = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
